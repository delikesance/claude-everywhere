<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia — Gardé</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .doc { max-width: 1120px; margin: 0 auto; padding: var(--s-32) var(--s-24) var(--s-72); }
  .mock { display: flex; flex-wrap: wrap; gap: var(--s-32); align-items: flex-start; margin-top: var(--s-16); }
  .lib__row { grid-template-columns: minmax(0, 1fr); }
  .lib__meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-4) var(--s-8); }
</style>
<script src="../theme.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<symbol id="i-egress" viewBox="0 0 24 24"><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"/><path d="m21 3-9 9"/><path d="M15 3h6v6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
</svg>

<div class="doc">
<header>
  <p class="overline"><a href="../index.html">← Système de design</a></p>
  <h1 class="display">Gardé</h1>
  <p class="caption" style="margin-top:var(--s-4)">24 entrées · <span class="badge badge--local"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>local</span></p>
  <div role="radiogroup" aria-label="Apparence" class="seg" style="margin-top:var(--s-12)">
    <button class="seg__cell" role="radio" aria-checked="true" data-theme-set="system">Système</button>
    <button class="seg__cell" role="radio" aria-checked="false" data-theme-set="light">Clair</button>
    <button class="seg__cell" role="radio" aria-checked="false" data-theme-set="dark">Sombre</button>
  </div>
</header>
<main>

<section aria-labelledby="h-list">
  <h2 id="h-list">Liste</h2>
  <div class="mock"><figure><figcaption class="caption frame-caption">Liste à plat, recherche unique, clic = réouverture dans la conversation</figcaption>
  <div class="frame" style="width:560px"><div class="lib__main">
    <div class="row" style="margin-bottom:var(--s-12)"><div class="input-group grow"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input class="input" type="search" aria-label="Rechercher" placeholder="Rechercher…"></div><button class="btn btn--secondary btn--compact"><svg class="icon" aria-hidden="true"><use href="#i-egress"/></svg>Exporter</button></div>
    <ul style="list-style:none;padding:0">
      <li class="lib__row"><div><a href="#h-list" class="row-title">Le déclin des abeilles sauvages</a><p class="caption clamp-1">Deux causes principales : la disparition des milieux naturels et l'usage des pesticides.</p><p class="lib__meta caption"><span class="tag">abeilles</span><span class="tag">lecture</span><span>lemonde.fr · 12 octobre</span></p></div></li>
      <li class="lib__row"><div><a href="#h-list" class="row-title">Réforme communale : le calendrier</a><p class="caption clamp-1">L'application est prévue pour l'automne, avec une phase d'essai dans six régions.</p><p class="lib__meta caption"><span class="tag">lecture</span><span>lemonde.fr · 10 octobre</span></p></div></li>
      <li class="lib__row"><div><a href="#h-list" class="row-title">Traduction du paragraphe 4</a><p class="caption clamp-1">Version française du paragraphe sur les pollinisateurs.</p><p class="lib__meta caption"><span class="tag">traduction</span><span>nature.com · 8 octobre</span></p></div></li>
    </ul>
  </div></div></figure></div>
</section>

<section aria-labelledby="h-search">
  <h2 id="h-search">Recherche et états</h2>
  <div class="mock">
    <figure><figcaption class="caption frame-caption">Résultats</figcaption>
    <div class="frame" style="width:520px"><div class="lib__main">
      <div class="input-group"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input class="input" type="search" aria-label="Rechercher" value="pesticides"></div>
      <p class="caption" role="status" style="margin:var(--s-8) 0">2 résultats pour «&#8239;pesticides&#8239;»</p>
      <ul style="list-style:none;padding:0">
        <li class="lib__row"><div><p class="row-title">Le déclin des abeilles sauvages</p><p class="caption clamp-1">…l'usage des <mark class="hit">pesticides</mark>. D'autres facteurs…</p></div></li>
        <li class="lib__row"><div><p class="row-title">Agriculture et biodiversité</p><p class="caption clamp-1">…réduction des <mark class="hit">pesticides</mark> de synthèse…</p></div></li>
      </ul></div></div></figure>
    <figure><figcaption class="caption frame-caption">Aucun résultat</figcaption>
    <div class="frame" style="width:520px"><div class="lib__main">
      <div class="input-group"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input class="input" type="search" aria-label="Rechercher" value="zzyzx"></div>
      <div class="sb-empty" role="status"><h2>Rien dans la marge pour «&#8239;zzyzx&#8239;».</h2><p class="caption" style="margin-top:var(--s-4)">Essayez un autre mot.</p><button class="btn btn--secondary" style="margin-top:var(--s-12)">Effacer la recherche</button></div>
    </div></div></figure>
    <figure><figcaption class="caption frame-caption">Vide : aucune entrée encore</figcaption>
    <div class="frame" style="width:520px"><div class="lib__main">
      <div class="sb-empty"><h2>Rien n'est encore gardé.</h2><p class="caption" style="margin-top:var(--s-4)">Une réponse gardée depuis la conversation apparaîtra ici.</p><a href="#h-search" class="btn btn--secondary" style="margin-top:var(--s-12)">Retour à la conversation</a></div>
    </div></div></figure>
    <figure><figcaption class="caption frame-caption">Chargement</figcaption>
    <div class="frame" style="width:520px"><div class="lib__main" role="status" aria-busy="true">
      <p class="caption">Chargement de « Gardé »…</p>
      <ul style="list-style:none;padding:0" aria-hidden="true">
        <li class="lib__row"><div><div class="ghost" style="width:60%;height:16px"></div><div class="ghost" style="width:80%"></div></div></li>
        <li class="lib__row"><div><div class="ghost" style="width:45%;height:16px"></div><div class="ghost" style="width:70%"></div></div></li>
      </ul></div></div></figure>
  </div>
</section>
</main>
</div>
</body>
</html>
