<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia — Bibliothèque</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .doc { max-width: 1120px; margin: 0 auto; padding: var(--s-32) var(--s-24) var(--s-72); }
  .mock { display: flex; flex-wrap: wrap; gap: var(--s-32); align-items: flex-start; margin-top: var(--s-16); }
</style>
<script src="../theme.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<symbol id="i-egress" viewBox="0 0 24 24"><path d="M21 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h6"/><path d="m21 3-9 9"/><path d="M15 3h6v6"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
</svg>

<div class="doc">
<header>
  <p class="overline"><a href="../index.html">← Système de design</a></p>
  <h1 class="display">Bibliothèque</h1>
  <div role="radiogroup" aria-label="Apparence" class="seg" style="margin-top:var(--s-12)">
    <button class="seg__cell" role="radio" aria-checked="true" data-theme-set="system">Système</button>
    <button class="seg__cell" role="radio" aria-checked="false" data-theme-set="light">Clair</button>
    <button class="seg__cell" role="radio" aria-checked="false" data-theme-set="dark">Sombre</button>
  </div>
</header>
<main>

<section aria-labelledby="h-list">
  <h2 id="h-list">Liste</h2>
  <div class="mock"><figure><figcaption class="caption frame-caption">Liste, tout est local</figcaption>
  <div class="frame" style="width:880px"><div class="lib">
    <nav class="lib__rail" aria-label="Filtres">
      <p class="overline">Étiquettes</p>
      <ul class="stack" style="list-style:none;padding:0;gap:var(--s-4)">
        <li><a href="#h-list">Toutes (24)</a></li><li><a href="#h-list">abeilles (6)</a></li><li><a href="#h-list">lecture (11)</a></li><li><a href="#h-list">traduction (4)</a></li>
      </ul>
      <span class="badge badge--local"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>Stocké sur cet appareil</span>
    </nav>
    <div class="lib__main">
      <div class="row"><h2 class="grow">Bibliothèque</h2><div class="input-group" style="width:260px"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input class="input" type="search" aria-label="Rechercher" placeholder="Rechercher…"></div></div>
      <ul style="list-style:none;padding:0">
        <li class="lib__row"><span class="pilcrow" aria-hidden="true">¶</span><div class="grow"><p class="row-title">Le déclin des abeilles sauvages</p><p class="caption">lemonde.fr · 12 octobre · 3 éditions <span class="tag">abeilles</span> <span class="tag">lecture</span></p></div></li>
        <li class="lib__row"><span class="pilcrow" aria-hidden="true">¶</span><div class="grow"><p class="row-title">Réforme communale : le calendrier</p><p class="caption">lemonde.fr · 10 octobre · 1 édition <span class="tag">lecture</span></p></div></li>
        <li class="lib__row"><span class="pilcrow" aria-hidden="true">¶</span><div class="grow"><p class="row-title">Traduction du paragraphe 4</p><p class="caption">nature.com · 8 octobre · 2 éditions <span class="tag">traduction</span></p></div></li>
      </ul>
    </div>
  </div></div></figure></div>
  <div class="mock">
    <figure><figcaption class="caption frame-caption">Bibliothèque vide, aucune entrée encore</figcaption>
    <div class="frame" style="width:520px"><div class="lib__main">
      <div class="sb-empty"><h2>La bibliothèque est vide.</h2><p class="caption" style="margin-top:var(--s-4)">Aucune entrée encore. Enregistrez une réponse depuis le panneau latéral, elle apparaîtra ici.</p><span class="badge badge--local" style="margin-top:var(--s-12)"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>Stocké sur cet appareil</span></div>
    </div></div></figure>
    <figure><figcaption class="caption frame-caption">Chargement de la liste</figcaption>
    <div class="frame" style="width:520px"><div class="lib__main" role="status" aria-busy="true">
      <p class="caption">Chargement de la bibliothèque…</p>
      <ul style="list-style:none;padding:0" aria-hidden="true">
        <li class="lib__row"><span class="pilcrow">¶</span><div class="grow"><div class="ghost" style="width:60%;height:16px"></div><div class="ghost" style="width:80%"></div></div></li>
        <li class="lib__row"><span class="pilcrow">¶</span><div class="grow"><div class="ghost" style="width:45%;height:16px"></div><div class="ghost" style="width:70%"></div></div></li>
        <li class="lib__row"><span class="pilcrow">¶</span><div class="grow"><div class="ghost" style="width:55%;height:16px"></div><div class="ghost" style="width:65%"></div></div></li>
      </ul></div></div></figure>
  </div>
</section>

<section aria-labelledby="h-search">
  <h2 id="h-search">Recherche</h2>
  <div class="mock">
    <figure><figcaption class="caption frame-caption">Résultats</figcaption>
    <div class="frame" style="width:520px"><div class="lib__main">
      <div class="input-group"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input class="input" type="search" aria-label="Rechercher" value="pesticides"></div>
      <p class="caption" role="status">2 résultats pour «&#8239;pesticides&#8239;»</p>
      <ul style="list-style:none;padding:0">
        <li class="lib__row"><span class="pilcrow" aria-hidden="true">¶</span><div class="grow"><p class="row-title">Le déclin des abeilles sauvages</p><p class="caption">…l'usage des <mark class="hit">pesticides</mark>. D'autres facteurs…</p></div></li>
        <li class="lib__row"><span class="pilcrow" aria-hidden="true">¶</span><div class="grow"><p class="row-title">Agriculture et biodiversité</p><p class="caption">…réduction des <mark class="hit">pesticides</mark> de synthèse…</p></div></li>
      </ul></div></div></figure>
    <figure><figcaption class="caption frame-caption">Aucun résultat</figcaption>
    <div class="frame" style="width:520px"><div class="lib__main">
      <div class="input-group"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input class="input" type="search" aria-label="Rechercher" value="zzyzx"></div>
      <div class="sb-empty" role="status"><h2>Rien dans la marge pour «&#8239;zzyzx&#8239;».</h2><p class="caption" style="margin-top:var(--s-4)">Essayez un autre mot, ou retirez une étiquette.</p><button class="btn btn--secondary" style="margin-top:var(--s-12)">Effacer la recherche</button></div>
    </div></div></figure>
  </div>
</section>

<section aria-labelledby="h-detail">
  <h2 id="h-detail">Détail</h2>
  <div class="mock"><figure><figcaption class="caption frame-caption">Entrée avec éditions, étiquettes, export et ajout au contexte</figcaption>
  <div class="frame" style="width:880px"><div class="lib">
    <nav class="lib__rail" aria-label="Retour"><a href="#h-list">← Toute la bibliothèque</a></nav>
    <div class="lib__main">
      <h2>Le déclin des abeilles sauvages</h2>
      <p class="caption">lemonde.fr · enregistré le 12 octobre · stocké sur cet appareil</p>
      <div class="row" style="flex-wrap:wrap"><span class="tag">abeilles<button class="tag__x" aria-label="Retirer l'étiquette abeilles"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button></span><span class="tag">lecture<button class="tag__x" aria-label="Retirer l'étiquette lecture"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button></span><button class="btn btn--quiet btn--compact">+ Étiquette</button></div>
      <div class="tabs" role="tablist" aria-label="Éditions"><button class="tab" role="tab" aria-selected="true">Édition 3 (actuelle)</button><button class="tab" role="tab" aria-selected="false">Édition 2</button><button class="tab" role="tab" aria-selected="false">Édition 1</button></div>
      <div role="tabpanel"><p class="reading">Deux causes principales&#8239;: la disparition des milieux naturels et l'usage des pesticides. Le climat vient en troisième position, loin derrière.</p></div>
      <div class="row" style="flex-wrap:wrap;margin-top:var(--s-12)">
        <button class="btn btn--primary"><svg class="icon" aria-hidden="true"><use href="#i-egress"/></svg>Joindre au contexte</button>
        <button class="btn btn--secondary">Exporter en Markdown</button>
        <button class="btn btn--secondary">Exporter en JSON</button>
        <span class="grow"></span>
        <button class="btn btn--danger">Supprimer</button>
      </div>
      <p class="inline-confirm"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Joint à la conversation en cours.</p>
    </div>
  </div></div></figure></div>
</section>
</main>
</div>
</body>
</html>
